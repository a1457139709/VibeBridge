name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      claude_tests:
        description: 'Run Claude hook tests (simulated CLI; no Claude account or network)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VIBEBRIDGE_TEST_CLAUDE: ${{ github.event_name == 'workflow_dispatch' && inputs.claude_tests && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npm run rebuild:terminal
      - run: npm run prepare:runtime
      - run: npm run check
      - run: npm run build
  desktop:
    name: Desktop checks
    needs: code
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npm run rebuild:terminal
      - run: npm run prepare:runtime
      - run: npm run build
      - name: Critical desktop flows
        id: desktop
        timeout-minutes: 10
        run: npm run test:desktop:all
      - name: Claude hook desktop flow (simulated CLI)
        id: claude
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.claude_tests }}
        timeout-minutes: 5
        run: npm run test:desktop -- --claude-hooks
      - name: Upload desktop failure diagnostics
        if: ${{ failure() && (steps.desktop.outcome == 'failure' || steps.claude.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-desktop-failure
          path: work/desktop-artifacts/
          retention-days: 7
          if-no-files-found: warn
