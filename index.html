let projects=[],active='vibe',selected='v1',collapsed=false,expanded=new Set(['vibe']),sheet=null,settings=false,dirty=false,pending=null,maximized=null,toast='',scene='normal';
let focusAfter=null;
function seed(){projects=[{id:'vibe',name:'VibeBridge',running:true,agents:[{id:'v1',agent:'codex',title:'Refine project navigation',state:'busy'},{id:'v2',agent:'claude',title:'Review settings interactions',state:'input'},{id:'v3',agent:'pi',title:'Document keyboard shortcuts',state:'done'},{id:'v4',agent:'codex',title:'Investigate reconnect behavior',state:'error'},{id:'v5',agent:'claude',title:'Untitled task',state:'ready'}]},{id:'atlas',name:'Atlas API',running:true,agents:[{id:'a1',agent:'claude',title:'Approve the schema migration',state:'input'},{id:'a2',agent:'codex',title:'Add search pagination',state:'busy'},{id:'a3',agent:'pi',title:'Check authentication flow',state:'done'}]},{id:'notes',name:'Field Notes',running:true,agents:[{id:'n1',agent:'pi',title:'Untitled task',state:'ready'}]},{id:'archive',name:'Personal website',running:false,agents:[]}];if(scene==='dense'){projects[0].agents[0].title='Refine project navigation and keyboard focus while preserving unsaved settings';for(let i=1;i<=9;i++)projects.splice(projects.length-1,0,{id:'extra'+i,name:'Client workspace '+i+' · long project name',running:true,agents:[{id:'e'+i,agent:['codex','claude','pi'][i%3],title:'Review the complete accessibility and localization requirements',state:['busy','input','done','error','ready'][i%5]}]})}if(scene==='empty')projects.forEach(p=>p.agents.forEach(a=>a.state='ready'));active='vibe';selected='v1';maximized=null;sheet=null;settings=false;dirty=false;pending=null;expanded=new Set(['vibe'])}
function counts(p){return Object.fromEntries(['input','done','error'].map(s=>[s,p.agents.filter(a=>a.state===s).length]))}
function countButtons(p){let c=counts(p),keys=Object.keys(c);return keys.length?keys.map(s=>`<button class="count ${c[s]?'':'zero'}" data-filter="${p.id}|${s}" aria-expanded="${sheet?.kind==='results'&&sheet.project===p.id&&sheet.state===s}" aria-controls="status-results" ${c[s]?'':'disabled'} aria-label="${p.name}: ${c[s]} ${labels[s]}">${icon(s)}<span><b>${c[s]}</b> ${labels[s]}</span></button>`).join(''):'<span class="muted" style="padding:5px">No active counts</span>'}
function running(){return projects.filter(p=>p.running)}
function summaryContent(){let p=projects.find(p=>p.id===active);return `<div class="sheet-title"><strong>${p.name}</strong><button class="plain" data-action="dismiss" aria-label="Close summary">×</button></div><p>Current project</p><div class="counts">${countButtons(p)}</div>`}
function currentStatus(where){let p=projects.find(p=>p.id===active);return `<section class="current-status ${where}" aria-label="Current project status: ${p.name}">${where==='toolbar-status'||where==='bottom-status'?'':`<span class="status-project truncate" title="${p.name}">${p.name}</span>`}<div class="counts">${p.running?countButtons(p):'<span class="muted no-status">Not started</span>'}</div></section>`}
function nav(){return `<nav class="nav" aria-label="Project navigation"><div class="nav-scroll"><div class="nav-heading">WORK PROJECTS</div>${projects.map(p=>`<section class="project-section"><div class="project-row"><button class="plain" data-expand="${p.id}" aria-label="${expanded.has(p.id)?'Collapse':'Expand'} ${p.name}" aria-expanded="${expanded.has(p.id)}">${expanded.has(p.id)?'⌄':'›'}</button><button class="plain project-button ${active===p.id&&!settings?'selected':''}" data-project="${p.id}" title="${p.name}"><span class="initial">${p.name[0]}</span><span class="truncate">${p.name}</span><small>${p.agents.length}</small></button></div>${expanded.has(p.id)?p.agents.map(a=>`<button class="plain nav-agent ${a.agent} ${selected===a.id&&!settings?'selected':''}" data-locate="${p.id}|${a.id}" title="${a.title} · ${labels[a.state]}">${icon(a.state)}${mark(a.agent)}<span class="truncate">${a.title}</span></button>`).join(''):''}</section>`).join('')}</div>${variant==='A'?currentStatus('nav-status'):''}<div class="nav-footer"><span>Local Agent workbench</span><button class="plain" data-action="settings" aria-label="Settings">⚙</button></div></nav>`}
function panel(p,a,i){let compact=scene==='compact'&&!maximized,small=compact&&i!==1,shape=i===0?'vertical':i===4?'strip':'';let line={busy:'Working through the remaining changes…',input:'May I apply these changes?\n\n  Allow once    Allow for this session    Deny',done:'The review is ready.\n\nSee the notes above for the findings.',error:'The last request could not continue.',ready:'What would you like to work on?'}[a.state];return `<article id="panel-${a.id}" tabindex="-1" class="panel ${a.agent} ${selected===a.id?'focused':''} ${small?'small '+shape:''}" data-select="${a.id}" aria-label="${a.title}, ${labels[a.state]}"><header><span class="identity">${icon(a.state,true)}${mark(a.agent)}</span><span class="truncate" title="${a.title}">${a.title}</span><button class="plain" data-max="${a.id}" aria-label="${maximized?'Restore layout':'Maximize panel'}">⤢</button></header><div class="terminal"><span class="agent-mark ${a.agent}" style="width:auto;font-size:13px">${a.agent==='claude'?'Claude Code':a.agent==='codex'?'Codex CLI':'pi'}</span><span class="muted"> · ~/Projects/${p.name.replaceAll(' ','-')}</span>\n\n${line}<span class="prompt muted">› ${a.state==='input'?'Choose an option':a.state==='busy'?'esc to interrupt':'Send a message'}</span></div></article>`}
function render(){let p=projects.find(p=>p.id===active);document.documentElement.dataset.theme=$('#theme').checked?'dark':'light';
$('#app').innerHTML=`<div class="app ${$('#narrow').checked?'narrow':''}">
<header class="system"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><button class="plain" data-action="nav" aria-label="${collapsed?'Expand':'Collapse'} project navigation">☷</button><span class="wordmark">VibeBridge</span></header>
<div class="body">${collapsed?'':nav()}<main class="work">
${settings?`<div class="settings"><button class="plain" data-action="back">← Back</button><h1>Settings</h1><p>Agent settings</p><label>Default command<input id="command" value="${dirty?'codex --model demo':'codex'}" aria-label="Default command"></label><button data-action="save">Save</button><span class="muted" style="margin-left:10px">${dirty?'Unsaved changes':'Saved'}</span></div>`:
`<div class="toolbar ${variant==='B'?'toolbar-inline':''}"><strong class="truncate" title="${p.name}">${p.name}</strong><span class="path truncate" title="~/Projects/${p.name.replaceAll(' ','-')}">~/Projects/${p.name.replaceAll(' ','-')}</span>${variant==='B'?currentStatus('toolbar-status'):''}${maximized?'<button class="plain" data-action="restore" aria-label="Restore layout" title="Restore layout">⤢</button>':''}</div><div class="panels ${scene==='compact'?'compact':''} ${maximized?'maximized':''}">${p.agents.length?p.agents.filter(a=>!maximized||a.id===maximized).map(a=>panel(p,a,p.agents.indexOf(a))).join(''):'<div class="empty">Project not started</div>'}</div>`}
</main></div>
${variant==='C'?currentStatus('bottom-status'):''}
${sheet?`<aside id="status-results" class="sheet ${variant==='A'?'sheet-left':variant==='C'?'sheet-bottom':''}" aria-label="${sheet.kind==='summary'?'Current project status':'Matching panels'}">${sheet.kind==='summary'?summaryContent():results()}</aside>`:''}
${toast?`<div class="toast" role="status">${toast}</div>`:''}
${pending?`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="leave-title"><h2 id="leave-title">Save changes before leaving?</h2><p>Your settings have unsaved changes.</p><footer><button data-action="cancel">Cancel</button><button data-action="discard">Don't save</button><button data-action="save-leave">Save and leave</button></footer></section></div>`:''}</div>`;
$('#variant-label').textContent=variant+' · '+variants[variant];
$('#legend').innerHTML=Object.keys(labels).map(s=>`<span>${icon(s)}${labels[s]}</span>`).join('');
$('#readout').textContent=`${variant} | ${variants[variant]} | Project: ${p.name} | Panel: ${selected} | ${maximized?'Max: '+maximized:'Tiled'} | Draft: ${dirty} | ${Object.entries(counts(p)).map(([s,n])=>n+' '+labels[s]).join(', ')}${variant==='A'&&collapsed?' | 导航收起：本方案的汇总随导航隐藏':''}${variant==='B'&&settings?' | 设置页：本方案的项目栏不显示':''}`;
alignSheet();if(pending)$('[data-action="cancel"]').focus();if(focusAfter){$(focusAfter)?.focus();focusAfter=null}}
function alignSheet(){
  if(variant!=='C'||sheet?.kind!=='results')return;
  const trigger=document.querySelector(`[data-filter="${sheet.project}|${sheet.state}"]`),popup=$('.sheet'),app=$('.app');
  if(!trigger||!popup)return;
  const a=app.getBoundingClientRect(),b=trigger.getBoundingClientRect();
  popup.style.left=Math.max(12,Math.min(b.left-a.left,a.width-popup.offsetWidth-12))+'px';
  popup.style.bottom=(a.bottom-b.top+8)+'px';
  popup.style.maxHeight=Math.max(80,b.top-a.top-56)+'px';
}
function dismissSheet(){let old=sheet;sheet=null;if(old?.kind==='results')focusAfter=`[data-filter="${old.project}|${old.state}"]`;render()}
window.addEventListener('resize',alignSheet);
function results(){let p=projects.find(p=>p.id===sheet.project),list=p.agents.filter(a=>a.state===sheet.state);return `<div class="sheet-title"><strong>${list.length} ${labels[sheet.state]}</strong><button class="plain" data-action="dismiss" aria-label="Close results">×</button></div><p>${p.name} · select a panel to locate it</p>${list.length?list.map(a=>`<button class="result ${a.agent}" data-locate="${p.id}|${a.id}">${icon(a.state)}${mark(a.agent)}<span class="truncate">${a.title}<small>${a.agent==='claude'?'Claude Code':a.agent==='codex'?'Codex CLI':'pi'}</small></span><span aria-hidden="true">↗</span></button>`).join(''):'<div class="empty">No panels in this state</div>'}`}
function locate(project,id){const old=active;active=project;selected=id||projects.find(p=>p.id===project).agents[0]?.id||'';maximized=null;settings=false;sheet=null;expanded.add(project);focusAfter=id?'#panel-'+id:null;toast=id?`${old!==project?'Switched project · ':''}Located ${projects.find(p=>p.id===project).agents.find(a=>a.id===id).title}`:'';render();setTimeout(()=>{toast='';if(!pending)render()},2500)}
function navigate(project,id){if(settings&&dirty){pending={project,id};render()}else locate(project,id)}
function setVariant(v){variant=v;sheet=null;const url=new URL(location);url.searchParams.set('variant',v);history.replaceState({},'',url);render()}
function cycle(n){let keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+n+3)%3])}
document.addEventListener('click',e=>{if(sheet&&!e.target.closest('.sheet,[data-filter],.lab,.switcher,.modal-wrap')){sheet=null;render()}let t=e.target.closest('button');if(!t){let p=e.target.closest('[data-select]');if(p&&selected!==p.dataset.select){selected=p.dataset.select;render()}return}if(t.dataset.expand){let id=t.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);render()}if(t.dataset.project)navigate(t.dataset.project);if(t.dataset.filter){let [project,state]=t.dataset.filter.split('|');if(sheet?.project===project&&sheet.state===state){dismissSheet()}else{sheet={kind:'results',project,state};focusAfter='.sheet .result';render()}}if(t.dataset.locate){let [p,a]=t.dataset.locate.split('|');navigate(p,a)}if(t.dataset.max){selected=t.dataset.max;maximized=maximized?null:selected;render()}let a=t.dataset.action;if(a==='nav'){collapsed=!collapsed;render()}if(a==='summary'){sheet=sheet?.kind==='summary'?null:{kind:'summary'};render()}if(a==='dismiss')dismissSheet();if(a==='settings'){settings=true;sheet=null;render()}if(a==='back')navigate(active,selected);if(a==='save'){dirty=false;render()}if(a==='restore'){maximized=null;render()}if(a==='cancel'){pending=null;render()}if(a==='discard'||a==='save-leave'){let dest=pending;dirty=false;pending=null;locate(dest.project,dest.id)}});
document.addEventListener('input',e=>{if(e.target.id==='command'){dirty=true;$('#readout').textContent+=' | Draft changed'}});
document.addEventListener('keydown',e=>{if(pending){if(e.key==='Escape'){pending=null;render()}if(e.key==='Tab'){let items=[...document.querySelectorAll('.modal button')],i=items.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&i===items.length-1){e.preventDefault();items[0].focus()}}return}if(e.key==='Escape'&&sheet){dismissSheet();return}if(e.target.closest('input,textarea,select,[contenteditable],button,[tabindex]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);for(let id of ['narrow','theme'])$('#'+id).onchange=render;$('#scene').onchange=()=>{scene=$('#scene').value;seed();render()};$('#draft').onclick=()=>{settings=true;dirty=true;sheet=null;render()};$('#advance').onclick=()=>{let a=projects.flatMap(p=>p.agents).find(a=>a.id===selected);if(a){let keys=Object.keys(labels);a.state=keys[(keys.indexOf(a.state)+1)%keys.length];render()}};$('#reset').onclick=()=>{seed();collapsed=false;render()};seed();render();
</script></html>
